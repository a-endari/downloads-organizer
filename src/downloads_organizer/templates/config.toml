# Downloads Organizer configuration
#
# The application works with built-in defaults even without this file.
# Create your personal config:  downloads-organizer config --init
# Open in editor:               downloads-organizer config --edit
#
# Configuration values are merged with built-in defaults, so you only
# need to specify the settings you want to change.

[general]
# Directory used when no directory is supplied to the CLI.
downloads_directory = "~/Downloads"

# Maximum length for filenames shown in verbose output before they are
# shortened in the middle. Set to 0 to disable truncation.
truncate_length = 45

# Categories determine where files are moved.
#
# The key (e.g. "documents") is the stable internal name used by rules.
# The "folder" value is the actual directory name created in Downloads.
# You can change the folder name without changing any rules.
#
# Example:
#   [categories.documents]
#   folder = "My Documents"
# means files assigned to "documents" go to ~/Downloads/My Documents/

[categories.documents]
folder = "Documents"

[categories.pictures]
folder = "Pictures"

[categories.audio]
folder = "Music"

[categories.video]
folder = "Video"

[categories.code]
folder = "Code"

[categories.programs]
folder = "Programs"

[categories.archives]
folder = "Compressed"

[categories.ebooks]
folder = "Ebooks"

[categories.other_files]
folder = "Other Files"

[categories.other_folders]
folder = "Other Folders"

# Files and directories listed here are never organized.
# Built-in ignored files are always included.
# These settings ADD to the built-in ignore list.

[ignore]
files = [".DS_Store", ".localized", "desktop.ini", "Thumbs.db"]
directories = []

# User-defined classification rules.
# Rules assign files to categories using the internal category key.
# Available rule types (checked in this order of precedence):
#   1. filenames  - exact filename match
#   2. regex      - Python regular expression
#   3. patterns   - shell-style glob (e.g. "*.torrent")
#   4. extensions - file extension match
#
# A more specific rule always wins over a more general one.

[rules.extensions]
# ".torrent" = "archives"

[rules.filenames]
# "README" = "code"

[rules.patterns]
# "invoice-*.pdf" = "documents"

[rules.regex]
# "^IMG_[0-9]{4,6}\.jpg$" = "pictures"
