[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downloads-organizer"
version = "0.5.2"
description = "A lightweight, deterministic, privacy-first Downloads folder organizer."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abbas Endari", email = "a.endari@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
dlo = "downloads_organizer.main:main"
downloads-organizer = "downloads_organizer.main:main"
ae-dlo = "downloads_organizer.main:main"

[project.urls]
Homepage = "https://github.com/a-endari/downloads-organizer"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/downloads_organizer"]
